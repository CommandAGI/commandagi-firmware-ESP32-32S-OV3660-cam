; CommandAGI ESP32-CAM firmware — pair over BLE, stream under your account.
; Target: AI-Thinker ESP32-CAM (ESP32 + OV2640, 4MB flash, PSRAM). Pins are overridable in
; src/config.h for ESP32-S3 boards. See README.md.
;
; Build/flash:  pio run -t upload && pio device monitor
; The board flashes over USB-UART (GPIO0→GND for boards without auto-reset). We deliberately do NOT
; enable Secure Boot or Flash Encryption, and the partition table keeps two OTA app slots, so the
; firmware can ALWAYS be re-flashed over USB or updated over-the-air later.

[env:esp32cam]
platform = espressif32@^6.5.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; Dual-OTA, no-Secure-Boot layout — guarantees re-flashability + future OTA (see partitions.csv).
board_build.partitions = partitions.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L

lib_deps =
  h2zero/NimBLE-Arduino@^1.4.2
  bblanchon/ArduinoJson@^7.0.4
  links2004/WebSockets@^2.6.1

build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  ; AI-Thinker camera pin map (default). For an ESP32-S3 board, set -DCAM_BOARD_ESP32S3 and adjust
  ; the pins in src/config.h.
  -DCAM_BOARD_AITHINKER

; ── ESP32-S3 variant: DFRobot ESP32-S3 AI Camera (SKU DFR1154) ────────────────────────────────────
; OV3660 sensor, 16MB flash + 8MB octal (OPI) PSRAM, native USB-Serial/JTAG (no CH340). Same firmware
; as [env:esp32cam]; only the SoC, PSRAM/flash mode, and camera pin map (-DCAM_BOARD_DFR_S3_AICAM)
; differ. USB-CDC-on-boot is REQUIRED so Serial (the BLE-suffix banner the flasher reads back) lands
; on the native USB port instead of the UART0 pins. Build/flash:  pio run -e esp32cam-s3 -t upload
[env:esp32cam-s3]
platform = espressif32@^6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

board_build.partitions = partitions.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

lib_deps =
  h2zero/NimBLE-Arduino@^1.4.2
  bblanchon/ArduinoJson@^7.0.4
  links2004/WebSockets@^2.6.1

build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  -DCAM_BOARD_DFR_S3_AICAM
  ; Route Arduino Serial to the native USB CDC (this board has no UART bridge).
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; ── Verified-camera SKU (multi-modal + tamper-evident) ────────────────────────────────────────────
; A SEPARATE board build: ESP32-S3 + an Ed25519-capable secure element (NXP SE050 — NOT the ATECC608,
; which is P-256 only; see hardware/VERIFIED_SKU.md §3) holding the signing key + a chassis tamper switch
; + corroborating sensors (LiDAR / thermal-IR / EMI). It signs a per-window
; CaptureManifest and streams it as a sidecar; the platform re-verifies and recomputes cross-modal
; coherence (packages/domain/core/src/capture-coherence.ts). STILL re-flashable: we do NOT burn Secure Boot /
; Flash Encryption eFuses — the key's confidentiality comes from the SE, not from locking the board.
; Enable exactly the sensors a given unit carries (each is independently gated). See src/config.h and
; hardware/README.md for the BOM + wiring, and the "tamper-evident not tamper-proof" caveat.
;   Build/flash:  pio run -e esp32cam-verified -t upload
[env:esp32cam-verified]
platform = espressif32@^6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

board_build.partitions = partitions.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

lib_deps =
  h2zero/NimBLE-Arduino@^1.4.2
  bblanchon/ArduinoJson@^7.0.4
  links2004/WebSockets@^2.6.1
  ; TODO(hardware): add the driver libs for the wired parts during bring-up, e.g.
  ;   stm32duino/VL53L5CX (LiDAR), melexis/MLX90640 (thermal-IR), the NXP SE05x/Plug-and-Trust middleware
  ;   (Ed25519 secure element — NOT an ATECC608 lib; that part is P-256 only), kosme/arduinoFFT (EMI
  ;   spectrum). The HAL stubs in src/sensors/ compile without them.

build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  -DCAM_BOARD_ESP32S3
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Turn on the verified-SKU capture path + the sensors this reference unit carries. Drop any -D your
  ; specific board doesn't populate; a verified build with only -DCAGI_VERIFIED_SKU still signs a
  ; single-modality ("rgb") tamper-aware manifest.
  -DCAGI_VERIFIED_SKU=1
  -DCAGI_SECURE_ELEMENT=1
  -DCAGI_SENSOR_LIDAR=1
  -DCAGI_SENSOR_THERMAL=1
  -DCAGI_SENSOR_EMI=1
