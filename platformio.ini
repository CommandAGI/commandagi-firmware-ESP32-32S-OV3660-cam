; CommandAGI ESP32-CAM firmware — pair over BLE, stream under your account.
; Target: AI-Thinker ESP32-CAM (ESP32 + OV2640, 4MB flash, PSRAM). Pins are overridable in
; src/config.h for ESP32-S3 boards. See README.md.
;
; Build/flash:  pio run -t upload && pio device monitor
; The board flashes over USB-UART (GPIO0→GND for boards without auto-reset). We deliberately do NOT
; enable Secure Boot or Flash Encryption, and the partition table keeps two OTA app slots, so the
; firmware can ALWAYS be re-flashed over USB or updated over-the-air later.

[env:esp32cam]
platform = espressif32@^6.5.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; Dual-OTA, no-Secure-Boot layout — guarantees re-flashability + future OTA (see partitions.csv).
board_build.partitions = partitions.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L

lib_deps =
  h2zero/NimBLE-Arduino@^1.4.2
  bblanchon/ArduinoJson@^7.0.4
  links2004/WebSockets@^2.6.1

build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  ; AI-Thinker camera pin map (default). For an ESP32-S3 board, set -DCAM_BOARD_ESP32S3 and adjust
  ; the pins in src/config.h.
  -DCAM_BOARD_AITHINKER

; ── ESP32-S3 variant: DFRobot ESP32-S3 AI Camera (SKU DFR1154) ────────────────────────────────────
; OV3660 sensor, 16MB flash + 8MB octal (OPI) PSRAM, native USB-Serial/JTAG (no CH340). Same firmware
; as [env:esp32cam]; only the SoC, PSRAM/flash mode, and camera pin map (-DCAM_BOARD_DFR_S3_AICAM)
; differ. USB-CDC-on-boot is REQUIRED so Serial (the BLE-suffix banner the flasher reads back) lands
; on the native USB port instead of the UART0 pins. Build/flash:  pio run -e esp32cam-s3 -t upload
[env:esp32cam-s3]
platform = espressif32@^6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

board_build.partitions = partitions.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

lib_deps =
  h2zero/NimBLE-Arduino@^1.4.2
  bblanchon/ArduinoJson@^7.0.4
  links2004/WebSockets@^2.6.1

build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  -DCAM_BOARD_DFR_S3_AICAM
  ; Route Arduino Serial to the native USB CDC (this board has no UART bridge).
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; ── Sealed stream: the device seals its own frames ──────────────────────────────────────────────
; The DFR1154 build with -DCAGI_DEVICE_SEALS=1: an Ed25519 key made on the first boot (libsodium, in
; NVS), each frame stamped and indexed in `cam-at`, a seal over both once a second (src/seal/, from
; CommandAGI's deployments/clients/seal-c). The Cam-002 envs turn it on the same way. README § Sealed stream.
;   Build/flash:  pio run -e esp32cam-s3-seals -t upload
[env:esp32cam-s3-seals]
extends = env:esp32cam-s3
build_flags =
  ${env:esp32cam-s3.build_flags}
  -DCAGI_DEVICE_SEALS=1

; ── Cellular variants: an LTE modem (SIMCom A7670-class) over UART, PPP into lwIP ─────────────────
; arduino-esp32 2.x ships lwIP without PPP, so these envs build Arduino as an ESP-IDF component
; (framework = arduino, espidf) with sdkconfig.defaults.<soc>: Arduino's own sdkconfig plus PPP. The
; camera driver comes from the ESP-IDF component registry (src/idf_component.yml). HTTPS and the
; realtime socket run over the modem unchanged. Pins: src/config.h § Cellular. README § Cellular.
;   pio run -e esp32cam-cellular        AI-Thinker + the Cam-001 base board's modem (no mic: shared pins)
;   pio run -e esp32cam-s3-cellular     DFR1154 + the Cam-002 carrier's modem
[env:esp32cam-cellular]
extends = env:esp32cam
framework = arduino, espidf
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.esp32
build_flags =
  ${env:esp32cam.build_flags}
  -DCAGI_CELLULAR_ENABLED=1

[env:esp32cam-s3-cellular]
extends = env:esp32cam-s3
framework = arduino, espidf
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.esp32s3
build_flags =
  ${env:esp32cam-s3.build_flags}
  -DCAGI_CELLULAR_ENABLED=1
